<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContactEase - Manage Your Contacts Effortlessly</title>
  <link rel="stylesheet" href="../css codes/homepagestyle.css">
</head>
<body>
  
  <div class="sidebar">
    <h2 style="color: white; margin-bottom: 20px;">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="3" y1="15" x2="21" y2="15"/>
        <line x1="9" y1="9" x2="9" y2="21"/>
      </svg>
      <span class="text">Categories</span>
    </h2>
    <div class="sidebar-filters">
      <button class="filter-btn active" data-category="all">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2v20M2 12h20"/>
        </svg>
        <span class="text">All Contacts</span>
      </button>
      <button class="filter-btn" data-category="work">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v16"/>
        </svg>
        <span class="text">Work</span>
      </button>
      <button class="filter-btn" data-category="family">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text">Family</span>
      </button>
      <button class="filter-btn" data-category="friends">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="16" y1="11" x2="22" y2="11"/>
        </svg>
        <span class="text">Friends</span>
      </button>
      <button class="add-category-btn" id="sidebarAddCategoryBtn">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        <span class="text">Add Category</span>
      </button>
    </div>
  </div>
  
  <div class="main-content">
    <div class="multi-select-controls">
    <div class="selected-count">
      Selected: <span id="selectedCount">0</span>
    </div>
    <button class="move-selected-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 9l7-7 7 7"/>
        <path d="M12 2v20M2 12h20"/>
      </svg>
      Move
    </button>
    <button class="delete-selected-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18"/>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
      </svg>
      Delete
  </button>
    <button class="cancel-select-btn">
      Cancel
    </button>
  </div>
    <div class="header-box">
      <div>
        <h1 class="header-title">ContactEase</h1>
        <p class="header-subtitle">Manage your Contacts Effortlessly</p>
      </div>
      <div class="header-actions">
        <input type="file" id="importInput" accept=".json,.csv">
        <button class="import-export-btn" id="importBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg> 
          Import
        </button>
        <button class="import-export-btn" id="exportBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 5 17 10"/>
            <line x1="12" y1="5" x2="12" y2="17"/>
          </svg>      
          Export
        </button>
        <button class="add-contact-btn" id="addContactBtn">+ Add Contact</button>
        <button class="sign-out-btn" id="signOutBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </div>
    </div>
    
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Search contacts..." id="searchBar">
      <select class="search-options-select" id="searchOption">
        <option value="all">Search By</option>
        <option value="name">Name</option>
        <option value="email">Email</option>
        <option value="phone">Phone</option>
      </select>
    </div>
  
    <div class="filter-options">
    </div>
  
    <div class="contacts-grid" id="contactsGrid">
      <!-- Contacts will be populated by JavaScript -->
    </div>
  </div>
  
  <div class="modal" id="deleteModal">
    <div class="modal-content">
  <h2 style="color: white; margin-bottom: 20px; font-size: 24px;">Delete Contact</h2>
  <p style="color: #ccc; margin-bottom: 20px;">Are you sure you want to delete this contact?</p>
  <div class="modal-buttons">
    <button class="modal-btn cancel-btn" id="cancelDelete" style="background: #666; margin-right: 10px;">Cancel</button>
    <button class="modal-btn confirm-btn" id="confirmDelete" style="background: #ff4444;">Delete</button>
  </div>
</div>
  </div>
  
  <div class="add-contact-modal" id="addContactModal">
    <div class="add-contact-form">
      <h2 class="form-title">Add New Contact</h2>
      <form id="newContactForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="fullName" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-input" id="phone" required>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <div style="display: flex; gap: 10px; align-items: center;">
            <select class="form-select" id="category" required style="flex: 1;">
              <option value="work">Work</option>
              <option value="family">Family</option>
              <option value="friends">Friends</option>
              <option value="custom">Add Custom Category</option>
            </select>
            <input type="text" class="form-input" id="customCategoryInput" placeholder="Enter category name" style="flex: 1; display: none;">
          </div>
        </div>
        <div class="form-buttons">
          <button type="button" class="form-cancel" id="cancelAdd">Cancel</button>
          <button type="submit" class="form-submit">Add Contact</button>
        </div>
      </form>
  </div>
  </div>
  
  <div class="edit-contact-modal" id="editContactModal">
    <div class="add-contact-form">
      <h2 class="form-title">Edit Contact</h2>
      <form id="editContactForm">
        <input type="hidden" id="editContactId">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="editFullName" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="editEmail" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-input" id="editPhone" required>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="editCategory" required>
            <option value="work">Work</option>
            <option value="family">Family</option>
            <option value="friends">Friends</option>
            <option value="custom">Add Custom Category</option>
          </select>
        </div>
        <div class="form-buttons">
          <button type="button" class="form-cancel" id="cancelEdit">Cancel</button>
          <button type="submit" class="form-submit" id="SaveChanges">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="email-modal" id="emailModal">
    <div class="email-form">
      <h2 class="form-title">Send Email</h2>
      <form id="emailForm">
        <input type="hidden" id="emailTo">
        <div class="form-group">
          <label class="form-label">To</label>
          <input type="email" class="form-input" id="emailRecipient" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Subject</label>
          <input type="text" class="form-input" id="emailSubject" required>
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-input" id="emailMessage" required></textarea>
        </div>
        <div class="form-buttons">
          <button type="button" class="form-cancel" id="cancelEmail">Cancel</button>
          <button type="submit" class="form-submit">Send Email</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="custom-category-modal" id="customCategoryModal">
    <div class="custom-category-form">
      <h2 class="custom-category-title">Add Custom Category</h2>
      <input type="text" class="custom-category-input" id="customCategoryModalInput" placeholder="Enter category name">
      <div id="categoryErrorMessage" class="category-error-message"></div>
      <div class="custom-category-buttons">
        <button class="custom-category-btn custom-category-cancel" id="cancelCustomCategory" onclick="document.getElementById('customCategoryModal').style.display = 'none';">Cancel</button>
        <button class="custom-category-btn custom-category-submit" id="submitCustomCategory">Add Category</button>
      </div>
    </div>
  </div>
  
  <div class="category-select-modal" id="categorySelectModal">
    <div class="category-select-form">
      <h2 class="category-select-title">Move Contacts To Category</h2>
      <select class="form-select" id="moveToCategory">
        <option value="work">Work</option>
        <option value="family">Family</option>
        <option value="friends">Friends</option>
        <option value="custom">Add Custom Category</option>
      </select>
      <div class="category-select-buttons">
        <button class="category-select-btn form-cancel" id="cancelMove">Cancel</button>
        <button class="category-select-btn form-submit" id="confirmMove">Move</button>
      </div>
    </div>
  </div>
  
  <div class="modal" id="signOutModal">
    <div class="modal-content">
      <h2 style="color: white; margin-bottom: 20px; font-size: 24px;">Sign Out</h2>
      <p style="color: #ccc; margin-bottom: 20px;">Are you sure you want to sign out?</p>
      <div class="modal-buttons">
        <button class="modal-btn cancel-btn" id="cancelSignOut" style="background: #666; margin-right: 10px;">Cancel</button>
        <button class="modal-btn confirm-btn" id="confirmSignOut" style="background: #ff4444;">Sign Out</button>
      </div>
    </div>
  </div>
  <script src="../js codes/app.js"></script>
</body>
</html>
